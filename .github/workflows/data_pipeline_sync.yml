name: Daily Kaggle Data Sync & Pipeline

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r football-dashboard/data-pipeline/requirements.txt

      - name: Download Latest Datasets from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python football-dashboard/data-pipeline/download_data.py --dest-dir ./

      - name: Process & Build Static JSON API
        run: |
          python football-dashboard/data-pipeline/build_data.py --data-dir ./ --output-dir football-dashboard/frontend/public/data

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add football-dashboard/frontend/public/data/ players_data-2025_2026.csv players.csv player_valuations.csv clubs.csv transfers.csv
          
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): automated Kaggle dataset sync [skip ci]"
            git push origin main
          fi
